<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>videoma — pre-analyse</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:14px Inter,system-ui,sans-serif}.wrap{max-width:860px;margin:auto;padding:50px 20px}.muted{color:#777}.row{display:flex;gap:10px;align-items:center;margin:20px 0}input,button{height:44px;border-radius:10px;border:1px solid #292929;background:#0a0a0a;color:#fff;padding:0 13px}input{flex:1}button{cursor:pointer;background:#0878f9;border-color:#0878f9;font-weight:700}button:disabled{opacity:.5}.bar{height:8px;background:#141414;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#1686ff}.log{margin-top:20px;font:12px ui-monospace,monospace;white-space:pre-wrap;color:#a9b2c0;max-height:52vh;overflow:auto}
</style></head><body><div class="wrap"><h1>Pré-analyse permanente</h1><p class="muted">Analyse les 1 017 vidéos une seule fois et enregistre la Video Intelligence Database.</p>
<div class="row"><input id="secret" type="password" placeholder="PREANALYZE_SECRET"><button id="start">Démarrer / reprendre</button></div>
<div><strong id="count">0 / 1 017</strong><div class="bar"><i id="fill"></i></div></div><div class="log" id="log"></div></div>
<script>
const q=s=>document.querySelector(s),log=q("#log"),count=q("#count"),fill=q("#fill"),btn=q("#start");
function line(x){log.textContent+=x+"\n";log.scrollTop=log.scrollHeight}
async function api(method,body){
 const secret=q("#secret").value;if(!secret)throw new Error("Secret requis");
 const r=await fetch("/api/admin/preanalyze",{method,headers:{"Content-Type":"application/json","x-admin-secret":secret},body:body?JSON.stringify(body):undefined});
 const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||"HTTP "+r.status);return data
}
function once(el,event,ms=15000){return new Promise((ok,bad)=>{const t=setTimeout(()=>bad(new Error("timeout "+event)),ms);el.addEventListener(event,()=>{clearTimeout(t);ok()},{once:true});el.addEventListener("error",()=>{clearTimeout(t);bad(new Error("video error"))},{once:true})})}
async function seek(v,t){if(Math.abs(v.currentTime-t)>.03){const p=once(v,"seeked");v.currentTime=t;await p}if(v.requestVideoFrameCallback)await new Promise(r=>v.requestVideoFrameCallback(r))}
function cover(ctx,v,x,y,w,h){const vw=v.videoWidth||w,vh=v.videoHeight||h,k=Math.max(w/vw,h/vh),sw=w/k,sh=h/k;ctx.drawImage(v,(vw-sw)/2,(vh-sh)/2,sw,sh,x,y,w,h)}
async function sheet(index,url){
 const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="metadata";v.src="/api/video-proxy?url="+encodeURIComponent(url);v.load();if(v.readyState<1)await once(v,"loadedmetadata");
 const d=v.duration,w=160,h=284,c=document.createElement("canvas");c.width=w*4;c.height=h;const ctx=c.getContext("2d",{alpha:false});ctx.fillStyle="#000";ctx.fillRect(0,0,c.width,c.height);
 const ratios=[.08,.34,.64,.9],keyframes=[];
 for(let i=0;i<4;i++){const t=Math.max(.02,Math.min(d-.04,d*ratios[i]));await seek(v,t);cover(ctx,v,i*w,0,w,h);keyframes.push({slot:i+1,timeMs:Math.round(t*1000)})}
 const out={index,url,durationMs:Math.round(d*1000),keyframes,contactSheet:c.toDataURL("image/jpeg",.64)};v.removeAttribute("src");v.load();return out
}
function update(ready,total=1017){count.textContent=ready.toLocaleString("fr-FR")+" / "+total.toLocaleString("fr-FR");fill.style.width=Math.round(ready/total*100)+"%"}
btn.onclick=async()=>{
 btn.disabled=true;try{
   const urls=(await fetch("/videos.txt",{cache:"no-store"}).then(r=>r.text())).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
   let status=await api("GET");const done=new Set(status.items.filter(x=>x.status==="ready").map(x=>x.canonical_index));update(done.size,urls.length);line("Déjà analysées: "+done.size);
   const missing=urls.map((url,i)=>({url,index:i+1})).filter(x=>!done.has(x.index));
   for(let pos=0;pos<missing.length;pos+=5){
     const group=missing.slice(pos,pos+5),payload=[];
     for(const item of group){line("Frames vidéo "+item.index+"…");try{payload.push(await sheet(item.index,item.url))}catch(e){line("Échec frames "+item.index+": "+e.message)}}
     if(!payload.length)continue;
     line("Analyse + embedding "+payload.map(x=>x.index).join(", ")+"…");
     const saved=await api("POST",{videos:payload});for(const x of saved.saved){done.add(x.index);line("#"+x.index+" "+x.reactionType+" · énergie "+x.energyScore+" · "+x.audioStatus)}update(done.size,urls.length);
     await new Promise(r=>setTimeout(r,250));
   }
   line("Terminé.");
 }catch(e){line("ERREUR: "+e.message)}finally{btn.disabled=false}
};
</script></body></html>
