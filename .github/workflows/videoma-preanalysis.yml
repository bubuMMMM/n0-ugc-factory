name: Videoma permanent video preanalysis

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preanalyze:
    if: contains(github.event.head_commit.message, 'RUN_VIDEO_PREANALYSIS')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Process permanent video intelligence
        shell: bash
        run: |
          set -u
          JOB_ID="e3f5da69-0a8f-454b-af36-8bd58a591e6c"
          BASE="https://n0-ugc-factory.vercel.app/api/admin/process-preanalysis-batch"

          echo "Starting worker ${{ matrix.worker }}"

          for i in $(seq 1 260); do
            URL="$BASE?job=$JOB_ID&worker=${{ matrix.worker }}&iteration=$i"

            RESPONSE=$(curl -sS --max-time 65 --retry 2 --retry-delay 2 "$URL" || true)

            if [ -z "$RESPONSE" ]; then
              echo "[$i] empty response; retrying"
              sleep 4
              continue
            fi

            echo "$RESPONSE"

            ERROR=$(echo "$RESPONSE" | jq -r '.error // empty' 2>/dev/null || true)
            if [ -n "$ERROR" ]; then
              echo "[$i] API error: $ERROR"
              sleep 5
              continue
            fi

            ACTIVE=$(echo "$RESPONSE" | jq -r '.active // true' 2>/dev/null || echo true)
            READY=$(echo "$RESPONSE" | jq -r '.counts.ready // 0' 2>/dev/null || echo 0)
            PENDING=$(echo "$RESPONSE" | jq -r '.counts.pending // 0' 2>/dev/null || echo 0)
            PROCESSING=$(echo "$RESPONSE" | jq -r '.counts.processing // 0' 2>/dev/null || echo 0)
            ERRORS=$(echo "$RESPONSE" | jq -r '.counts.errors // 0' 2>/dev/null || echo 0)

            echo "worker=${{ matrix.worker }} iteration=$i ready=$READY pending=$PENDING processing=$PROCESSING errors=$ERRORS active=$ACTIVE"

            if [ "$ACTIVE" = "false" ]; then
              echo "Job complete."
              exit 0
            fi

            if [ "$PENDING" = "0" ] && [ "$PROCESSING" = "0" ]; then
              echo "No work remains."
              exit 0
            fi

            sleep 1
          done

          echo "Worker iteration cap reached."
